[project]
name = "norway-visa-guide"
version = "0.1.0"
description = "Thai-language chatbot for short-stay Norway visitor visas, based on official sources"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi~=0.162.0",
    "uvicorn~=0.54.0",
    "anthropic~=2.4.0",
    "pydantic-settings~=2.16.0",
    "pyyaml~=6.0.0",
    "httpx~=0.28.0",
    "markdownify~=1.2.0",
    "pypdf~=6.21.0",
    "beautifulsoup4~=4.15.0",
]

[dependency-groups]
dev = [
    "pytest~=9.2.0",
    "ruff~=0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
# BMAD's own skill scripts are vendored, not ours to lint.
extend-exclude = [".claude", "_bmad"]

[tool.ruff.format]
# Only Python files; code examples in docs and session logs are left as written.
exclude = ["**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The filter tests use full-width digits and no-break spaces on purpose.
"tests/**" = ["RUF001"]
