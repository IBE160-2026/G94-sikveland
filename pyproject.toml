[project]
name = "norway-visa-guide"
version = "0.1.0"
description = "Thai-language chatbot for short-stay Norway visitor visas, based on official sources"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi~=0.162.0",
    "uvicorn~=0.54.0",
    "anthropic~=2.4.0",
    "pydantic-settings~=2.16.0",
    "pyyaml~=6.0.0",
    "httpx~=0.28.0",
    "markdownify~=1.2.0",
    "pypdf~=6.21.0",
]

[dependency-groups]
dev = [
    "pytest~=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
