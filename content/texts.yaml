# Fixed user-facing texts (AD-6). Every Thai text here is reviewed by the adviser
# before release (NFR8). Each entry needs a non-empty `th` and `en`.
# `{ADVISER_CONTACT}` is replaced with ADVISER_CONTACT from the settings at startup.
# The key list is closed: adding or removing a key also means changing
# REQUIRED_TEXT_KEYS in app/ports/content.py.

texts:
  # Thai approved by the user (NFR8); the last sentence (feedback stored on the server,
  # Story 2.3) on 2026-11-15.
  privacy-notice:
    th: >-
      โปรดอย่าใส่เลขหนังสือเดินทาง เลขบัตรประชาชน เบอร์โทรศัพท์ ชื่อ ที่อยู่ หรืออีเมลในคำถาม
      ระบบจะลบเลขหนังสือเดินทางและเลขบัตรประชาชนให้อัตโนมัติ
      แต่จะไม่ลบเบอร์โทรศัพท์ ชื่อ ที่อยู่ และอีเมล คำถามของคุณจะถูกส่งไปยังบริการ AI เพื่อสร้างคำตอบ
      แชทของคุณ (20 แชทล่าสุด) จะถูกบันทึกไว้ในเครื่องนี้ด้วยจนกว่าคุณจะลบ
      ทุกคนที่ใช้เครื่องนี้สามารถอ่านได้
      บนเซิร์ฟเวอร์จะเก็บเฉพาะคำตอบ ใช่ หรือ ไม่ ของคำถามท้ายแชท พร้อมหมายเลขที่ไม่ระบุตัวตนและเวลาเท่านั้น
      ไม่เก็บข้อความในแชท
    en: >-
      Please do not include your passport number, ID card number, phone number,
      name, address or email in your question. Passport and ID card numbers are
      removed automatically, but phone numbers, names, addresses and emails are not.
      Your question is sent to an AI service to create the answer.
      Your chats (the latest 20) are also saved on this device until you delete them;
      anyone using this device can read them.
      The server stores only your Yes or No answer to the question at the end of a chat,
      with an anonymous number and the time, never the chat text.

  personal-info-reminder:
    th: >-
      เราได้ลบเลขหนังสือเดินทางหรือเลขบัตรประชาชนออกจากคำถามของคุณก่อนส่ง
      โปรดอย่าใส่ข้อมูลส่วนตัวในคำถาม
    en: >-
      We removed passport or ID card numbers from your question before sending it.
      Please do not include personal information in your questions.

  reply-no-answer:
    th: >-
      ขออภัย ไม่พบคำตอบสำหรับคำถามนี้ในแหล่งข้อมูลทางการที่เรามี
      กรุณาติดต่อที่ปรึกษาที่ {ADVISER_CONTACT}
    en: >-
      Sorry, we could not find an answer to this question in our official sources.
      Please contact the adviser at {ADVISER_CONTACT}.

  # Reply to category individual_assessment (FR3): no answer call, no source links.
  # Thai approved by the user on 2026-11-15 (NFR8).
  reply-embassy-decides:
    th: >-
      ขออภัย เราไม่สามารถประเมินได้ว่าคุณจะได้รับวีซ่าหรือไม่
      สถานทูตนอร์เวย์เป็นผู้พิจารณาและตัดสินคำร้องแต่ละคำร้อง และไม่มีใครอื่นที่ตอบคำถามนี้ได้
      หากมีคำถามทั่วไปเกี่ยวกับเอกสารหรือขั้นตอนการยื่นขอวีซ่า ถามได้เลย
    en: >-
      Sorry, we cannot assess whether you will get the visa.
      The Norwegian embassy considers and decides each application, and no one else can answer this question.
      If you have general questions about the documents or the application steps, feel free to ask.

  # Replies to categories out_of_scope (FR14) and reach_person (FR13): no answer call,
  # no source links. Thai approved by the user on 2026-11-15 (NFR8).
  reply-out-of-scope:
    th: >-
      ขออภัย แชทบอทนี้ตอบได้เฉพาะเรื่องวีซ่าท่องเที่ยวและวีซ่าเยี่ยมเยียนระยะสั้นสำหรับเดินทางไปนอร์เวย์เท่านั้น
      หากมีคำถามเรื่องอื่น กรุณาติดต่อที่ปรึกษาที่ {ADVISER_CONTACT}
      หากมีคำถามเกี่ยวกับวีซ่าระยะสั้นไปนอร์เวย์ ถามได้เลย
    en: >-
      Sorry, this chatbot only covers short-stay tourist and visitor visas to Norway.
      For other questions, please contact the adviser at {ADVISER_CONTACT}.
      If you have questions about short-stay visas to Norway, feel free to ask here.

  reply-reach-person:
    th: >-
      คุณสามารถติดต่อที่ปรึกษาได้โดยตรงที่ {ADVISER_CONTACT}
      ที่ปรึกษาจะช่วยตอบคำถามและให้คำแนะนำเกี่ยวกับการยื่นขอวีซ่าของคุณ
      คุณยังถามคำถามทั่วไปเกี่ยวกับวีซ่าที่นี่ได้เช่นกัน
    en: >-
      You can contact the adviser directly at {ADVISER_CONTACT}.
      The adviser can answer your questions and give advice on your visa application.
      You can also keep asking general visa questions here.

  # Category done (FR5): the reply is the feedback question; the page shows the
  # Yes/No buttons under it. After "No" the page shows feedback-follow-up and the
  # chat goes on; after "Yes" it shows feedback-thanks and the next question starts
  # a new chat. Thai approved by the user on 2026-11-15 (NFR8).
  feedback-question:
    th: คุณได้รับข้อมูลที่ต้องการครบถ้วนแล้วหรือไม่
    en: Have you received all the information you need?

  feedback-follow-up:
    th: คุณยังอยากทราบเรื่องอะไรอีก พิมพ์คำถามได้เลย
    en: What would you still like to know? Just type your question.

  feedback-thanks:
    th: ขอบคุณสำหรับคำตอบ หากมีคำถามใหม่ พิมพ์ได้เลย คำถามถัดไปจะเริ่มเป็นแชทใหม่
    en: Thank you for your answer. If you have a new question, just type it; your next question starts a new chat.

  feedback-yes:
    th: ใช่
    en: "Yes"

  feedback-no:
    th: ไม่
    en: "No"

  reply-demo-only:
    th: >-
      โหมดสาธิตตอบได้เฉพาะคำถามตัวอย่างเท่านั้น กรุณาแตะคำถามตัวอย่างด้านบน
      หากมีคำถามอื่น กรุณาติดต่อที่ปรึกษาที่ {ADVISER_CONTACT}
    en: >-
      Demo mode only answers the example questions. Please tap one of the example
      questions above. For other questions, please contact the adviser at {ADVISER_CONTACT}.

  error:
    th: >-
      ขออภัย เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้งภายหลัง
      หากยังมีปัญหา กรุณาติดต่อ {ADVISER_CONTACT}
    en: >-
      Sorry, something went wrong. Please try again later.
      If the problem continues, please contact {ADVISER_CONTACT}.

  demo-label:
    th: โหมดสาธิต
    en: Demo mode

  send-button:
    th: ส่ง
    en: Send

  question-placeholder:
    th: พิมพ์คำถามเกี่ยวกับวีซ่านอร์เวย์ที่นี่
    en: Type your question about the Norway visa here

  # Saved chats on this device: top bar, history panel, delete confirmations.
  # Thai approved by the user on 2026-11-15, with the last sentence of privacy-notice (NFR8).
  history-button:
    th: แชทที่บันทึกไว้
    en: Saved chats

  new-chat-button:
    th: แชทใหม่
    en: New chat

  history-title:
    th: แชทที่บันทึกไว้ในเครื่องนี้
    en: Chats saved on this device

  history-close:
    th: ปิด
    en: Close

  history-empty:
    th: ยังไม่มีแชทที่บันทึกไว้
    en: No saved chats yet.

  delete-chat:
    th: ลบ
    en: Delete

  delete-all-chats:
    th: ลบแชททั้งหมด
    en: Delete all chats

  confirm-delete-chat:
    th: ต้องการลบแชทนี้ใช่ไหม
    en: Delete this chat?

  confirm-delete-all-chats:
    th: ต้องการลบแชททั้งหมดในเครื่องนี้ใช่ไหม
    en: Delete all chats on this device?

example-questions:
  - id: tourist-visa-documents
    th: ขอวีซ่าท่องเที่ยวนอร์เวย์ต้องใช้เอกสารอะไรบ้าง
    en: What documents do I need for a Norway tourist visa?

  - id: how-to-start
    th: ถ้าจะขอวีซ่าไปนอร์เวย์ ต้องเริ่มต้นอย่างไร
    en: How do I start applying for a Norway visa?

  - id: visa-fee
    th: ค่าธรรมเนียมวีซ่านอร์เวย์ราคาเท่าไร
    en: How much is the Norway visa fee?

  - id: processing-time
    th: การพิจารณาวีซ่าใช้เวลานานเท่าไร
    en: How long does the visa processing take?
