# Fixed document checklists, one per visit purpose (FR6, AD-11). Served by
# GET /api/checklists/{purpose}; never generated by the model.
#
# Thai texts approved by the user on 2026-11-15 (NFR8). UDI's requirements remain
# the authority (FR6); for applicants in Thailand they come as the embassy's official
# checklist, which the applicant prints, signs and hands in at VFS (item
# `signed-embassy-checklist`). Every change to a Thai text is reviewed against it again.
#
# Keys are the visit purposes `tourism`, `family` and `friends`; no more, no fewer.
# Each item has:
#   id      lowercase kebab-case, unique within its checklist. The page keeps the
#           applicant's ticks by this id, so NEVER reuse an id for different content:
#           give changed content a new id instead.
#   th, en  the text in Thai (shown) and English (stored)
#   source  an id from knowledge-base/sources.yaml, shown as the item's link
# The app refuses to start if any of this is broken.
#
# Items come from the embassy's checklist (embassy-visitor-visa-checklist): the general
# requirements in every checklist, the "Tourism" section for `tourism`, and the
# "Visiting family or friends" section for `family` and `friends`. Conditional items
# keep their condition in the text. The sponsorship form and the invitation letter
# link to the UDI pages where the person in Norway finds them; UDI says both apply to
# visits to family and friends. `family` also points to the embassy's separate checklist
# for family members of EU/EEA nationals. Where sources disagree, the embassy's
# checklist wins.
#
# Items shared between checklists are written once and repeated with YAML aliases
# (`&name` defines, `*name` repeats), so they cannot drift apart.

tourism:
  # General requirements (all visit purposes)
  - &signed-embassy-checklist
    id: signed-embassy-checklist
    source: embassy-visitor-visa-checklist
    th: >-
      รายการเอกสาร (checklist) ฉบับทางการของสถานทูต: พิมพ์ออกมา ทำเครื่องหมายในช่อง ลงชื่อ
      แล้วยื่นพร้อมเอกสารทั้งหมดเมื่อไปที่ VFS มิฉะนั้นคำร้องอาจถูกปฏิเสธ
    en: >-
      The embassy's official document checklist: print it, tick off the boxes, sign it
      and hand it in together with all required documents when you go to VFS, otherwise
      the application may be rejected.
  - &passport
    id: passport
    source: embassy-visitor-visa-checklist
    th: >-
      หนังสือเดินทางฉบับจริงที่มีอายุเหลืออย่างน้อย 3 เดือนหลังสิ้นสุดการเดินทางที่วางแผนไว้
      และมีหน้าว่างอย่างน้อย 2 หน้า พร้อมสำเนาหน้าข้อมูลส่วนตัว
    en: >-
      Original passport, valid for three months after the planned trip and with at
      least two blank pages, and a copy of the bio data page
  - &photo
    id: photo
    source: embassy-visitor-visa-checklist
    th: รูปถ่าย 1 รูป ถ่ายมาไม่เกิน 6 เดือน และไม่ผ่านการตกแต่ง
    en: One photo, not older than six months and not edited
  - &application-form
    id: application-form
    source: embassy-visitor-visa-checklist
    th: แบบฟอร์มคำร้องที่พิมพ์จากระบบออนไลน์ของ UDI และลงชื่อแล้ว
    en: The application form printed from UDI's online application portal, signed
  - &travel-insurance
    id: travel-insurance
    source: embassy-visitor-visa-checklist
    th: >-
      ประกันสุขภาพการเดินทางที่คุ้มครองตลอดการเดินทางและทุกประเทศในเขตเชงเก้น
      วงเงินคุ้มครองอย่างน้อย 30,000 ยูโร
    en: >-
      Travel medical insurance valid for the whole trip and the whole Schengen area,
      with coverage of at least EUR 30,000
  - &proof-of-identity
    id: proof-of-identity
    source: embassy-visitor-visa-checklist
    th: หลักฐานแสดงตัวตน
    en: Proof of identity
  - &name-change-certificate
    id: name-change-certificate
    source: embassy-visitor-visa-checklist
    th: "ถ้าเคยเปลี่ยนชื่อ: สำเนาใบเปลี่ยนชื่อ"
    en: "If you have changed your name: a copy of the name change certificate"
  - &proof-of-occupation
    id: proof-of-occupation
    source: embassy-visitor-visa-checklist
    th: หลักฐานการประกอบอาชีพ
    en: Proof of occupation
  - &employment-proof
    id: employment-proof
    source: embassy-visitor-visa-checklist
    th: >-
      ถ้าเป็นลูกจ้าง: หนังสือจดทะเบียนบริษัท และหนังสือรับรองการทำงานที่ระบุจำนวนวันลาที่ได้รับ
      ตำแหน่งในบริษัท และเงินเดือน
    en: >-
      If employed: a company registration and a statement of employment showing the
      vacation days granted, your position in the company and your monthly salary
  - &self-employment-proof
    id: self-employment-proof
    source: embassy-visitor-visa-checklist
    th: "ถ้าเป็นเจ้าของกิจการ: หลักฐานการเป็นเจ้าของกิจการ (หนังสือจดทะเบียนบริษัท)"
    en: "If self-employed: evidence of business ownership (company registration)"
  - &minor-birth-certificate
    id: minor-birth-certificate
    source: embassy-visitor-visa-checklist
    th: "ถ้าอายุต่ำกว่า 18 ปีและเดินทางโดยไม่มีผู้ปกครองตามกฎหมาย: สูติบัตร"
    en: "If under 18 and travelling without a legal guardian: birth certificate"
  - &minor-proof-of-custody
    id: minor-proof-of-custody
    source: embassy-visitor-visa-checklist
    th: >-
      ถ้าอายุต่ำกว่า 18 ปีและเดินทางโดยไม่มีผู้ปกครองตามกฎหมาย: หลักฐานการมีอำนาจปกครอง
      เช่น ทะเบียนสมรส ทะเบียนหย่า หรือทะเบียนบ้าน
    en: >-
      If under 18 and travelling without a legal guardian: proof of custody (for
      example a marriage certificate, divorce certificate or registration of residence)
  - &minor-consent-letter
    id: minor-consent-letter
    source: embassy-visitor-visa-checklist
    th: >-
      ถ้าอายุต่ำกว่า 18 ปี เดินทางโดยไม่มีผู้ปกครองตามกฎหมาย และผู้ปกครองไม่ได้มาด้วยตอนยื่นคำร้อง:
      หนังสือยินยอมฉบับจริงจากผู้ปกครองตามกฎหมาย ที่รับรองโดยหน่วยงานทางกฎหมาย
      (เช่น สำนักงานเขตหรืออำเภอ หรือศาล)
    en: >-
      If under 18, travelling without a legal guardian, and the legal guardian is not
      present when the application is handed in: the original letter of consent from
      the legal guardian(s), verified by a legal entity (for example a municipal
      registration office or a court)
  # Tourism
  - id: accommodation
    source: embassy-visitor-visa-checklist
    th: หลักฐานการจองโรงแรมหรือที่พักอื่นตลอดการเดินทาง
    en: A hotel reservation or other proof of accommodation for the whole stay
  - id: itinerary
    source: embassy-visitor-visa-checklist
    th: "ถ้าจะไปหลายประเทศ: แผนการเดินทาง"
    en: "If you visit several countries: an itinerary of the planned trip"
  - id: flight-reservation
    source: embassy-visitor-visa-checklist
    th: หลักฐานการจองตั๋วเครื่องบินไป-กลับ
    en: Proof of a round-trip flight reservation
  - id: organised-tour-voucher
    source: embassy-visitor-visa-checklist
    th: >-
      ถ้าเดินทางกับทัวร์: หนังสือรับรองหรือวอเชอร์ฉบับจริงจากบริษัททัวร์หรือบริษัทนำเที่ยว
      ที่ยืนยันการจองทัวร์
    en: >-
      If travelling on an organised tour: the original certificate or voucher from the
      travel agency or tour operator confirming the booking
  - id: bank-statements
    source: embassy-visitor-visa-checklist
    th: >-
      รายการเดินบัญชีธนาคารย้อนหลัง 3 เดือน ของคุณหรือของผู้ที่ออกค่าใช้จ่ายการเดินทาง
      หรือหลักฐานอื่นที่แสดงว่ามีเงินเพียงพอตลอดการเดินทางและการพำนัก
    en: >-
      Bank statements for the last three months, with account movements, yours or
      those of the person paying for the trip, or other proof that you have enough
      money for the whole journey and stay
  - id: ties-to-thailand
    source: embassy-visitor-visa-checklist
    th: >-
      ถ้าเกี่ยวข้อง: สำเนาโฉนดที่ดินหรือเอกสารสิทธิ์อสังหาริมทรัพย์ ทะเบียนสมรส
      สูติบัตรของบุตร
    en: >-
      If relevant: a copy of a real estate title deed, marriage certificate, birth
      certificates of children

family:
  # General requirements (all visit purposes)
  - *signed-embassy-checklist
  - *passport
  - *photo
  - *application-form
  - *travel-insurance
  - *proof-of-identity
  - *name-change-certificate
  - *proof-of-occupation
  - *employment-proof
  - *self-employment-proof
  - *minor-birth-certificate
  - *minor-proof-of-custody
  - *minor-consent-letter
  # Visiting family or friends
  - id: eu-eea-family-member
    source: embassy-necessary-documents
    th: >-
      ถ้าสมาชิกครอบครัวที่คุณไปเยี่ยมในนอร์เวย์เป็นพลเมืองของประเทศในกลุ่ม EU/EEA:
      ใช้รายการเอกสาร (checklist) แยกของสถานทูตสำหรับสมาชิกครอบครัวของพลเมือง EU/EEA
    en: >-
      If the family member you visit in Norway is a citizen of an EU/EEA country: the
      embassy's separate checklist for family members of EU/EEA nationals applies
  - &sponsorship-form
    id: sponsorship-form
    source: udi-sponsorship-form
    th: >-
      ถ้าผู้ที่เชิญคุณออกค่าใช้จ่ายระหว่างที่คุณพำนัก: แบบฟอร์มผู้สนับสนุน (Sponsorship form)
      ผู้สนับสนุนในนอร์เวย์เป็นผู้กรอกและลงชื่อในแบบฟอร์มนี้ แล้วส่งให้คุณทางไปรษณีย์หรืออีเมล
      ผู้สนับสนุนดาวน์โหลดแบบฟอร์มได้จากลิงก์ของ UDI
    en: >-
      If the person who invites you is paying for your stay: the sponsorship form
      (proof of sponsorship and/or private accommodation). Your sponsor in Norway fills
      in and signs the form, then sends it to you by post or email. The link goes to
      the form on UDI's website, where the sponsor can download it.
  - &invitation-letter
    id: invitation-letter
    source: udi-invitation-for-visitor-visa
    th: >-
      จดหมายเชิญ (Invitation letter) ผู้เชิญหรือผู้สนับสนุนของคุณในนอร์เวย์เป็นผู้เขียนและส่งให้คุณ
      โดยระบุเหตุผลที่เชิญ วันที่เสนอให้มาเยี่ยม ข้อมูลเกี่ยวกับผู้เชิญ (เช่น งานและที่อยู่อาศัย)
      และความสัมพันธ์ระหว่างคุณกับผู้เชิญ ผู้เชิญดูได้ที่ลิงก์ของ UDI ว่าจดหมายต้องมีข้อมูลอะไรบ้าง
    en: >-
      An invitation letter, which your host or sponsor in Norway writes and sends to
      you. It states why you are invited, the proposed dates of the visit, information
      about the person inviting you (for example their work and home) and how you are
      related. The link goes to UDI's page on what the letter must contain.
  - &proof-of-relationship
    id: proof-of-relationship
    source: embassy-visitor-visa-checklist
    th: >-
      หลักฐานความสัมพันธ์กับผู้ที่เชิญคุณ เช่น สูติบัตร ทะเบียนสมรส หรือทะเบียนบ้าน
      ถ้าไม่ได้มีความสัมพันธ์ทางกฎหมาย: สำเนาหน้าข้อมูลส่วนตัวในหนังสือเดินทางและประวัติการเดินทางของผู้สนับสนุน
      และหลักฐานการติดต่อกัน (กรณีเป็นแฟน)
    en: >-
      Proof of your relationship with the person who invites you, for example a birth
      or marriage certificate or family book. If you are not legally related: a copy of
      the bio data page of the sponsor's passport and their travel history, and proof
      of correspondence (boyfriend/girlfriend)
  - &social-and-financial-ties
    id: social-and-financial-ties
    source: embassy-visitor-visa-checklist
    th: >-
      ถ้าเกี่ยวข้อง: สำเนาโฉนดที่ดินหรือเอกสารสิทธิ์อสังหาริมทรัพย์ บัญชีธนาคาร ทะเบียนสมรส
      สูติบัตรของบุตร หรือหลักฐานอื่นที่แสดงความผูกพันทางสังคมหรือการเงินในประเทศไทย
    en: >-
      If relevant: a copy of a real estate title deed, bank account, marriage
      certificate, birth certificates of children, or other proof of social or
      financial ties in Thailand

friends:
  # General requirements (all visit purposes)
  - *signed-embassy-checklist
  - *passport
  - *photo
  - *application-form
  - *travel-insurance
  - *proof-of-identity
  - *name-change-certificate
  - *proof-of-occupation
  - *employment-proof
  - *self-employment-proof
  - *minor-birth-certificate
  - *minor-proof-of-custody
  - *minor-consent-letter
  # Visiting family or friends: the same section of the embassy's checklist
  - *sponsorship-form
  - *invitation-letter
  - *proof-of-relationship
  - *social-and-financial-ties
