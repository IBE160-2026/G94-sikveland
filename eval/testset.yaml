  # --- individual assessment: only the embassy decides ---------------------------------------------

  - id: own-chances-salary
    question: ฉันทำงานร้านนวด เงินเดือนหนึ่งหมื่นห้าพันบาท ยื่นไปแล้วจะโดนปฏิเสธไหมคะ
