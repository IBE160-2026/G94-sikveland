<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- All visible Thai text comes from /api/texts (AD-6); this file holds none. -->
  <title>Norway Visa Guide</title>
  <link rel="stylesheet" href="/style.css">
  <!-- history.js (saved chats on this device) must run before app.js. -->
  <script src="/history.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <!-- Stays at the top while the page scrolls. -->
  <header class="top">
    <!-- Demo mode only (MOCK_LLM=true). -->
    <p id="demo-label" class="demo-label" role="note" hidden></p>
    <nav id="top-bar" class="top-bar" hidden>
      <button type="button" id="history-button" class="top-button" aria-controls="history-panel"></button>
      <button type="button" id="new-chat-button" class="top-button"></button>
    </nav>
  </header>

  <main class="page">
    <section id="load-failed" class="load-failed" hidden>
      <button type="button" id="retry" class="retry">&#x21BB;</button>
    </section>

    <div id="chat" class="chat" hidden>
      <p id="privacy-notice" class="privacy-notice" role="note"></p>
      <div id="example-questions" class="example-questions"></div>
      <div id="messages" class="messages" aria-live="polite"></div>
    </div>
  </main>

  <form id="question-form" class="question-form" hidden>
    <textarea id="question" name="question" rows="2" maxlength="1000"></textarea>
    <button type="submit" id="send" class="send"></button>
  </form>

  <!-- Saved chats, newest first; full screen over the chat. -->
  <section id="history-panel" class="history-panel" role="dialog" aria-modal="true"
           aria-labelledby="history-title" hidden>
    <div class="history-header">
      <h2 id="history-title" class="history-title"></h2>
      <button type="button" id="history-close" class="top-button"></button>
    </div>
    <p id="history-empty" class="history-empty"></p>
    <ul id="history-list" class="history-list"></ul>
    <button type="button" id="delete-all-chats" class="delete-all"></button>
  </section>
</body>
</html>
